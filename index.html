<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fichas de dilución</title>
  <meta name="description" content="Buscador de fichas de dilución de medicamentos de uso hospitalario: dilución, estabilidad, compatibilidades, dosis y efectos secundarios.">
  <meta name="theme-color" content="#0f766e">

  <link rel="stylesheet" href="estilos.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased">

  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90">
    <div class="mx-auto flex max-w-5xl items-center gap-3 px-4 py-3">
      <a href="#/" class="flex items-center gap-3 min-w-0" aria-label="Ir al inicio">
        <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-teal-700 text-white">
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6.5L4.6 18.2A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.7-2.8L14 9.5V3"/><path d="M7.5 15h9"/></svg>
        </span>
        <span class="min-w-0">
          <span class="block text-lg font-bold leading-tight text-slate-900 dark:text-white">Fichas de dilución</span>
          <span class="block truncate text-xs text-slate-500 dark:text-slate-400">Medicamentos de uso hospitalario</span>
        </span>
      </a>
      <div class="ml-auto flex items-center gap-2">
        <a href="#/guia/uso" class="hidden sm:inline-flex btn-suave">¿Cómo usarlo?</a>
        <button id="btn-letra" type="button" class="btn-suave font-bold" title="Cambiar tamaño de letra" aria-label="Cambiar tamaño de letra">A+</button>
      </div>
    </div>
  </header>

  <main id="app" class="mx-auto max-w-5xl px-4 pb-16 pt-6">
    <p class="py-20 text-center text-slate-500">Cargando fichas…</p>
  </main>

  <footer class="border-t border-slate-200 bg-white py-8 text-sm text-slate-500 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-400">
    <div id="pie" class="mx-auto max-w-5xl space-y-2 px-4"></div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
